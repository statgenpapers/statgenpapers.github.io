name: Monthly list and deploy

# Scheduled and manual runs build a month's list, commit it, and deploy the site.
# A push that touches site/ only deploys. A commit made here with GITHUB_TOKEN does not
# start another run, which is why the deploy is part of this workflow.
on:
  schedule:
    - cron: "23 9 10 * *"  # the 10th of each month, 09:23 UTC: the list for the previous month
  workflow_dispatch:
    inputs:
      month:
        description: "Month to build, YYYY-MM (empty: the previous month)"
        required: false
      dry_run:
        description: "Build and commit in the runner only: push nothing, deploy nothing"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/monthly.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # a manual run from another branch still builds and deploys main
      - if: github.event_name != 'push'
        uses: astral-sh/setup-uv@v10.3.3  # this action publishes no moving major tag
      - if: github.event_name != 'push'
        uses: actions/checkout@v7  # the stored pools of the last 12 months: the monthly model's training data
        with:
          ref: training
          path: data/pools
      - if: github.event_name != 'push'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: embedding-model-potion-base-32M-1e5a03f8  # the model and revision pinned in model/weights.json
      - name: Build the list
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          MONTH: ${{ inputs.month }}
        run: |
          uv sync --locked
          uv run pytest -q
          uv run python -m pipeline ${MONTH:+--month "$MONTH"}
      - name: Commit the list, the vote snapshot and the model
        if: github.event_name != 'push'
        env:
          MONTH: ${{ inputs.month }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/votes model/weights.json
          git diff --cached --quiet || git commit -m "List for ${MONTH:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          git log --oneline -1 && git show --stat HEAD | tail -n 5
          [ "$DRY_RUN" = true ] || { git pull --rebase && git push; }
      - uses: actions/configure-pages@v6
        if: inputs.dry_run != true
      - uses: actions/upload-pages-artifact@v5
        if: inputs.dry_run != true
        with:
          path: site
      - id: deployment
        if: inputs.dry_run != true
        uses: actions/deploy-pages@v5
      # after the deploy: a failure here leaves the list published; the next run stores this month's pool again
      - name: Keep the last 12 months of pools on the branch training, in one commit
        if: github.event_name != 'push'
        working-directory: data/pools
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ls 20??-??.npz | sort | head -n -12 | xargs -r rm -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan latest
          git add -A
          git commit -q -m "Pools of $(ls 20??-??.npz | head -1 | cut -c1-7) to $(ls 20??-??.npz | tail -1 | cut -c1-7)"
          git show --stat HEAD | tail -n 15
          [ "$DRY_RUN" = true ] || git push -q -f origin latest:training
