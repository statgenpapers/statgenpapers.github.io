# Sources and list size for the monthly run. Edit, commit and push; no code changes needed.
# A venue that is new here scores on text alone (venue weight 0) until the weights are retrained.

# The shortlist: every paper whose pick chance is at least this. In the leak-free roll-forward (Jan-Oct 2026),
# 25% listed 15-39 papers a month, 254 in all, and caught 111 of 242 picks, as many as a fixed 25 a month.
min_pick_chance = 0.25

# OpenAlex work types kept from journals.
work_types = ["article", "review", "letter", "preprint"]

# Papers are dropped when the title starts with one of these (regular expressions, case-insensitive) ...
junk_title = [
  "author correction", "publisher correction", "correction", "erratum", "retraction",
  "expression of concern", "this month in", "in this issue", "news", "editorial",
]
# ... or the DOI matches one of these. 10.1038/d… is Nature-family news, comment and careers.
junk_doi = ['^10\.1038/d\d']

# Journals, fetched from OpenAlex by ISSN. `abbr` is the official title abbreviation shown in the
# Journal column and in short names. `key` is the venue key in model/weights.json: keep it stable.
[[journals]]
key = "Nature"
name = "Nature"
abbr = "Nature"
issn = "0028-0836"

[[journals]]
key = "NG"
name = "Nature Genetics"
abbr = "Nat Genet"
issn = "1061-4036"

[[journals]]
key = "NatCommun"
name = "Nature Communications"
abbr = "Nat Commun"
issn = "2041-1723"

[[journals]]
key = "NRG"
name = "Nature Reviews Genetics"
abbr = "Nat Rev Genet"
issn = "1471-0056"

[[journals]]
key = "NatMed"
name = "Nature Medicine"
abbr = "Nat Med"
issn = "1078-8956"

[[journals]]
key = "NatHumBehav"
name = "Nature Human Behaviour"
abbr = "Nat Hum Behav"
issn = "2397-3374"

[[journals]]
key = "Science"
name = "Science"
abbr = "Science"
issn = "0036-8075"

[[journals]]
key = "SciTranslMed"
name = "Science Translational Medicine"
abbr = "Sci Transl Med"
issn = "1946-6234"

[[journals]]
key = "Cell"
name = "Cell"
abbr = "Cell"
issn = "0092-8674"

[[journals]]
key = "CG"
name = "Cell Genomics"
abbr = "Cell Genom"
issn = "2666-979X"

[[journals]]
key = "AJHG"
name = "American Journal of Human Genetics"
abbr = "Am J Hum Genet"
issn = "0002-9297"

# Preprint servers (biorxiv or medrxiv) and their categories, as the server names them.
# `name` is shown in the Journal column. Every preprint has the one venue key "Preprint": a preprint is a preprint.
[[preprints]]
server = "biorxiv"
name = "bioRxiv"
categories = ["genetics", "genomics"]

[[preprints]]
server = "medrxiv"
name = "medRxiv"
categories = ["genetic and genomic medicine", "health informatics"]

# Learning from votes (docs/PLAN.md, section 3).
[votes]
firestore_project = "statgenpapers"
min_upvoted = 30  # no vote correction until this many listed papers have an upvote
lab_handle = "admin"  # its marks are the lab's picks, already in the lab weights: left out of the vote correction
penalty = 1.0     # L2 penalty on the correction; larger keeps the scorer closer to the lab weights
