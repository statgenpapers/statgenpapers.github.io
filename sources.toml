# Sources and list size for the monthly run. Edit, commit and push; no code changes needed.
# A venue that is new here scores on text alone (venue weight 0) until the weights are retrained.

# The shortlist: every paper whose Score is at least this. Leak-free, with each month calibrated on the months before
# it (2026-03..10): 30% listed 14-36 papers a month, 188 in all, and caught 107 of 258 marked papers; a fixed 24 a
# month caught 95; 25% listed 220 and caught 116.
min_pick_chance = 0.30

# The Firebase project whose interest counts and added papers label the monthly model (monthly/train.py)
firestore_project = "statgenpapers"

# OpenAlex work types kept from journals.
work_types = ["article", "review", "letter", "preprint"]

# Papers are dropped when the title starts with one of these (regular expressions, case-insensitive) ...
junk_title = [
  "author correction", "publisher correction", 'correction(?=\s*(:|to\b|$))', "erratum", "retraction",
  "expression of concern", "this month in", "in this issue", "news", "editorial", "reply to",
]
# ... or the DOI matches one of these. 10.1038/d… is Nature-family news, comment and careers.
junk_doi = ['^10\.1038/d\d']
# A Nature-family paper without an abstract stays only if its page gives one of these article types:
# research highlights, research briefings, news & views, comments and columns are left out.
nature_article_types = ["Article", "Letter", "Analysis", "Resource", "Technical Report", "Brief Communication",
  "Review Article", "Review", "Perspective", "Matters Arising", "Registered Report", "Methods"]

# Journals, fetched from OpenAlex by ISSN. `abbr` is the official title abbreviation shown in the
# Journal column and in short names. `key` is the venue key in data/model.json: keep it stable.
[[journals]]
key = "Nature"
name = "Nature"
abbr = "Nature"
issn = "0028-0836"

[[journals]]
key = "NG"
name = "Nature Genetics"
abbr = "Nat Genet"
issn = "1061-4036"

[[journals]]
key = "NatCommun"
name = "Nature Communications"
abbr = "Nat Commun"
issn = "2041-1723"

[[journals]]
key = "NRG"
name = "Nature Reviews Genetics"
abbr = "Nat Rev Genet"
issn = "1471-0056"
may_be_empty = true  # 2 to 18 papers a month: a month without any does not stop the run

[[journals]]
key = "NatMed"
name = "Nature Medicine"
abbr = "Nat Med"
issn = "1078-8956"

[[journals]]
key = "NatHumBehav"
name = "Nature Human Behaviour"
abbr = "Nat Hum Behav"
issn = "2397-3374"

[[journals]]
key = "Science"
name = "Science"
abbr = "Science"
issn = "0036-8075"

[[journals]]
key = "SciTranslMed"
name = "Science Translational Medicine"
abbr = "Sci Transl Med"
issn = "1946-6234"

[[journals]]
key = "Cell"
name = "Cell"
abbr = "Cell"
issn = "0092-8674"

[[journals]]
key = "CG"
name = "Cell Genomics"
abbr = "Cell Genom"
issn = "2666-979X"

[[journals]]
key = "AJHG"
name = "American Journal of Human Genetics"
abbr = "Am J Hum Genet"
issn = "0002-9297"

# Preprint servers (biorxiv or medrxiv) and their categories, as the server names them.
# Every preprint has the venue key "Preprint" and is shown as "Preprint": a preprint is a preprint.
[[preprints]]
server = "biorxiv"
name = "bioRxiv"
categories = ["genetics", "genomics"]

[[preprints]]
server = "medrxiv"
name = "medRxiv"
categories = ["genetic and genomic medicine", "health informatics"]
