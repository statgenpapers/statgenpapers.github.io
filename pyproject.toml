[project]
name = "statgenpapers"
version = "0.1.0"
description = "Monthly shortlist of statistical genetics papers"
requires-python = ">=3.12"
dependencies = ["model2vec>=0.6", "numpy>=2", "requests>=2.32", "scikit-learn>=1.5", "scipy>=1.14"]

[dependency-groups]
dev = ["pytest>=8"]
# local only: dev/coldstart/train.py and dev/coldstart/backtest/summary.py
train = ["pandas>=2.2", "pyarrow>=17"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
